name: Want LGTM:Internal

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]

jobs:
  want_lgtm:
    permissions:
      pull-requests: read
      issues: read
    uses: ./.github/workflows/want_lgtm.yaml
