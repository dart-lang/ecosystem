# A CI configuration to publish package:firehose to pub.dev.

name: Publish package:firehose

on:
  push:
    tags:
      - 'firehose-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@a1d8526c926344e01ba48a7368788c05ac98cb29
    with:
      working-directory: pkgs/firehose
      use-flutter: false
