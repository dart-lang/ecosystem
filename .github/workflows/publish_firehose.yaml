# A CI configuration to publish package:firehose to pub.dev.

name: Publish package:firehose

on:
  push:
    tags:
      - 'firehose-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@a5bff6576dfc51b47eb77d4b7084bba6a4daf8d2
    with:
      working-directory: pkgs/firehose
      use-flutter: false
